name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test without simulator SDK
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
          architecture: x64

      - name: Restore locked dependencies
        run: dotnet restore ClimbAndMaintain.Acars.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format ClimbAndMaintain.Acars.slnx --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build ClimbAndMaintain.Acars.slnx --configuration Release --no-restore

      - name: Run automated tests
        env:
          CM_ACARS_APP_PATH: "${{ github.workspace }}\\src\\ClimbAndMaintain.Acars.App\\bin\\Release\\net10.0-windows\\ClimbAndMaintain.Acars.App.exe"
          CM_ACARS_RUN_UI_TESTS: "1"
        run: dotnet test --solution ClimbAndMaintain.Acars.slnx --configuration Release --no-restore --no-build

      - name: Reject Microsoft SimConnect binaries and managed-wrapper metadata
        shell: pwsh
        run: ./scripts/Assert-NoMicrosoftSimConnect.ps1 -Path . -InspectBuildMetadata -RequireApplicationAdapter

      - name: Validate simulator evidence template structure
        shell: pwsh
        run: ./scripts/Test-SimulatorValidationEvidence.ps1 -Path docs/release/simulator-validation-evidence.template.json

      - name: Test changelog release-note extraction
        shell: pwsh
        run: ./scripts/Test-ChangelogReleaseNotes.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ github.run_id }}
          path: |
            **/TestResults/**
            artifacts/test-results/**
          if-no-files-found: ignore
          retention-days: 14
